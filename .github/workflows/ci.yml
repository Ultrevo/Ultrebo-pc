name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # RapidOCR pulls in the full opencv-python, which clashes with Qt; keep only the headless build.
          pip uninstall -y opencv-python
          pip install --force-reinstall --no-deps opencv-python-headless
      - name: Tests
        run: python -m pytest -q

  package:
    # Builds the real downloadable app on Windows and macOS and runs its self-test, so packaging
    # problems show up on every push. The zip is attached to the run for testing.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
          pip uninstall -y opencv-python
          pip install --force-reinstall --no-deps opencv-python-headless
      - name: Build
        run: pyinstaller --noconfirm --clean packaging/ultrebo.spec
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist/Ultrebo/Ultrebo.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/Ultrebo.app/Contents/MacOS/Ultrebo --selftest
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Ultrebo -DestinationPath Ultrebo-test-build.zip
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Ultrebo.app Ultrebo-test-build.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Ultrebo-test-build-${{ runner.os }}
          path: Ultrebo-test-build.zip
          retention-days: 14
