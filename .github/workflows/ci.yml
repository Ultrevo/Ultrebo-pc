name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # RapidOCR pulls in the full opencv-python, which clashes with Qt; keep only the headless build.
          pip uninstall -y opencv-python
          pip install --force-reinstall --no-deps opencv-python-headless
      - name: Tests
        run: python -m pytest -q

  package:
    # Builds the real downloadable app on Windows and macOS and runs its self-test, so packaging
    # problems show up on every push. The zip is attached to the run for testing.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip uninstall -y opencv-python
          pip install --force-reinstall --no-deps opencv-python-headless
      - name: Install PyInstaller (Windows, with its launcher compiled here)
        if: runner.os == 'Windows'
        run: pip install --no-binary pyinstaller pyinstaller
      - name: Install PyInstaller
        if: runner.os != 'Windows'
        run: pip install pyinstaller
      - name: Build
        run: pyinstaller --noconfirm --clean packaging/ultrebo.spec
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $report = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath dist/Ultrebo/Ultrebo.exe -ArgumentList "--selftest", $report -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/Ultrebo.app/Contents/MacOS/Ultrebo --selftest
      - name: Update-check test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "checkupdate.txt"
          $p = Start-Process -FilePath dist/Ultrebo/Ultrebo.exe -ArgumentList "--check-update", $report -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { throw "The packaged app could not check for updates (exit code $($p.ExitCode))" }
      - name: Update-check test (macOS)
        if: runner.os == 'macOS'
        run: dist/Ultrebo.app/Contents/MacOS/Ultrebo --check-update "$RUNNER_TEMP/checkupdate.txt"
      - name: Update test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Does what "Update now" does after the download: the installed app starts the helper and quits; the
          # helper must copy the new files over it and open it again.
          $root = Join-Path $env:RUNNER_TEMP "updatetest"
          $installed = Join-Path $root "installed\Ultrebo"
          $staging = Join-Path $root "staging"
          New-Item -ItemType Directory -Force (Split-Path $installed) | Out-Null
          Copy-Item -Recurse dist/Ultrebo $installed
          Copy-Item -Recurse dist/Ultrebo (Join-Path $staging "Ultrebo")
          "new" | Set-Content (Join-Path $staging "Ultrebo\added-by-update.txt")
          $old = Start-Process -FilePath (Join-Path $installed "Ultrebo.exe") -ArgumentList "--update-selftest", $installed, $staging -PassThru
          if (-not $old.WaitForExit(60000)) { $old.Kill(); throw "The app did not close itself after starting the update" }
          $copied = Join-Path $installed "added-by-update.txt"
          $reopened = $null
          for ($i = 0; $i -lt 90; $i++) {
            $reopened = Get-Process Ultrebo -ErrorAction SilentlyContinue | Where-Object { $_.Id -ne $old.Id } | Select-Object -First 1
            if ((Test-Path $copied) -and $reopened) { break }
            Start-Sleep -Seconds 1
          }
          $log = Join-Path $env:TEMP "ultrebo-update.log"
          if (Test-Path $log) { Write-Host "--- helper log"; Get-Content $log }
          if ($reopened) { $reopened.Kill() }
          if (-not (Test-Path $copied)) { throw "The helper did not copy the new files in" }
          if (-not $reopened) { throw "The helper did not open Ultrebo again" }
          if (Test-Path $staging) { throw "The helper left its staging folder behind" }
          Write-Host "update test: ok"
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Ultrebo -DestinationPath Ultrebo-test-build.zip
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Ultrebo.app Ultrebo-test-build.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Ultrebo-test-build-${{ runner.os }}
          path: Ultrebo-test-build.zip
          retention-days: 14
