name: Release builds

# Publish a GitHub Release (tag like v0.1.0) and this attaches Windows and macOS downloads to it.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-apple-silicon
          - os: macos-15-intel
            name: macos-intel
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.name == 'macos-intel' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Stamp the version from the tag
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          sed -i.bak "s/^__version__ = .*/__version__ = \"${VERSION}\"/" src/ultrebo/__init__.py
          rm -f src/ultrebo/__init__.py.bak
          grep __version__ src/ultrebo/__init__.py
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller
          pip uninstall -y opencv-python
          pip install --force-reinstall --no-deps opencv-python-headless
      - name: Tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build
        run: pyinstaller --noconfirm --clean packaging/ultrebo.spec
      - name: Self-test the built app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $report = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath dist/Ultrebo/Ultrebo.exe -ArgumentList "--selftest", $report -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
      - name: Self-test the built app (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/Ultrebo.app/Contents/MacOS/Ultrebo --selftest
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Ultrebo -DestinationPath "Ultrebo-${{ github.event.release.tag_name }}-${{ matrix.name }}.zip"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Ultrebo.app "Ultrebo-${{ github.event.release.tag_name }}-${{ matrix.name }}.zip"
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "Ultrebo-${{ github.event.release.tag_name }}-${{ matrix.name }}.zip" --clobber
