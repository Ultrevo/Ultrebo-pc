[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrebo"
dynamic = ["version"]
description = "Record and replay mouse and keyboard input, and react to images and text on screen."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "mss>=9.0",
    "pynput>=1.7.6",
    "PySide6-Essentials>=6.6",
    "Pillow>=10",
    "certifi",
    "rapidocr-onnxruntime>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.gui-scripts]
ultrebo = "ultrebo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "ultrebo.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
